<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#714B67">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deuris Mobile">
<title>Deuris Candy 2 - Mobile</title>
<style>
:root {
    --primary: #714B67; --primary-dark: #5a3b52; --bg: #f4f6f9; --card: #fff; --text: #333;
    --border: #e0e0e0; --ok: #2e7d32; --danger: #c62828; --warn: #f57c00; --muted: #777;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }

header.bar {
    position: sticky; top: 0; z-index: 10; background: var(--primary); color: #fff;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 12px; display: flex; align-items: center; gap: 10px;
}
header.bar h1 { font-size: 18px; font-weight: 700; flex: 1; }
.btn-back { background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 10px; width: 42px; height: 42px; font-size: 20px; cursor: pointer; display: none; }
.btn-back.show { display: block; }

main { max-width: 560px; margin: 0 auto; padding: 14px; }
.screen { display: none; }
.screen.active { display: block; }

/* Home */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px 10px;
    text-align: center; font-size: 15px; font-weight: 700; color: var(--primary); cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.05); min-height: 112px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.tile .ico { font-size: 34px; }
.tile:active { transform: scale(.97); background: #f6eff4; }
.tile.wide { grid-column: span 2; background: var(--primary); color: #fff; min-height: 84px; flex-direction: row; gap: 12px; font-size: 17px; }
.tile.wide:active { background: var(--primary-dark); }
.hello { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 16px; }

/* Controles */
label.f { display: block; font-size: 12px; font-weight: 700; color: #555; margin: 12px 0 5px; }
input, select {
    width: 100%; padding: 13px 12px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 16px; background: #fff; color: var(--text); outline: none; font-family: inherit;
}
input:focus, select:focus { border-color: var(--primary); }
input[disabled] { background: #f0f0f0; color: #555; }
.btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--primary); color: #fff; margin-top: 14px; }
.btn:active { background: var(--primary-dark); }
.btn:disabled { opacity: .6; }
.btn.sec { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
.btn.grey { background: #777; }
.btn.small { width: auto; display: inline-block; padding: 9px 14px; font-size: 14px; margin-top: 0; }

.chips { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: none; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; color: #555; }
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

.status { text-align: center; color: #666; font-size: 14px; padding: 14px 6px; }

/* Cartões de lista */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card .t { font-weight: 700; font-size: 15px; }
.card .s { font-size: 13px; color: var(--muted); margin-top: 3px; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-ok { background: #e8f5e9; color: var(--ok); }
.b-warn { background: #fff3e0; color: var(--warn); }
.b-bad { background: #ffebee; color: var(--danger); }
.b-info { background: #e3f2fd; color: #1976d2; }
.money { font-weight: 800; }
.money.neg { color: var(--danger); }
.money.pos { color: var(--ok); }
.total-card { background: #f4eef2; border: 2px solid var(--primary); }

/* Nova venda */
.picked { display: flex; justify-content: space-between; align-items: center; background: #f4eef2; border-radius: 12px; padding: 12px 14px; font-weight: 700; color: var(--primary); }
.picked button { background: none; border: none; color: var(--primary); text-decoration: underline; font-size: 14px; cursor: pointer; font-weight: 600; }
.results { border: 1px solid var(--border); border-radius: 12px; margin-top: 6px; overflow: hidden; background: #fff; }
.results button { display: block; width: 100%; text-align: left; padding: 13px 14px; border: none; border-bottom: 1px solid var(--border); background: #fff; font-size: 15px; cursor: pointer; }
.results button:last-child { border-bottom: none; }
.results button.new { color: var(--primary); font-weight: 700; }
.line { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-top: 10px; }
.line .name { font-weight: 700; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.line .x { background: none; border: none; color: var(--danger); font-size: 22px; cursor: pointer; line-height: 1; }
.line .ctrl { display: flex; gap: 10px; align-items: flex-end; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border); background: #f6f6f6; font-size: 20px; cursor: pointer; font-weight: 700; }
.stepper span { min-width: 30px; text-align: center; font-weight: 800; font-size: 17px; }
.line .price { flex: 1; }
.line .price input { padding: 10px; }
.line .sub { text-align: right; font-weight: 800; min-width: 80px; font-size: 14px; }
.warn-txt { color: var(--danger); font-size: 12px; margin-top: 6px; font-weight: 600; }
.sum { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin-top: 16px; color: var(--primary); }


/* Seletor de produto (2 colunas) */
.pick-btn { width: 100%; text-align: left; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; font-size: 16px; color: #333; cursor: pointer; position: relative; }
.pick-btn::after { content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #666; }
.pick-btn[disabled] { background: #f0f0f0; color: #777; }
.prod-list { display: none; border: 1px solid var(--primary); border-radius: 12px; margin-top: 6px; background: #fff; overflow: hidden; }
.prod-list.show { display: block; }
.prod-list input { border: none; border-bottom: 1px solid var(--border); border-radius: 0; }
.prod-head, .prod-item { display: grid; grid-template-columns: 1fr 74px; gap: 10px; align-items: center; padding: 10px 14px; }
.prod-head { background: #f4eef2; font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; }
.prod-head span:last-child, .prod-item span:last-child { text-align: center; }
.prod-body { max-height: 45vh; overflow-y: auto; }
.prod-item { width: 100%; border: none; border-bottom: 1px solid var(--border); background: #fff; font-size: 15px; text-align: left; cursor: pointer; }
.prod-item:last-child { border-bottom: none; }
.prod-item:active { background: #f4eef2; }
.prod-item .q { font-weight: 800; }
.prod-item .q.zero { color: var(--danger); }
.prod-vazio { padding: 14px; text-align: center; color: #666; font-size: 14px; }

/* Botão de local (cabeçalho) */
.btn-local { flex: 1; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 12px; padding: 11px 14px; font-size: 17px; font-weight: 700; cursor: pointer; text-align: left; min-width: 0; }
.btn-local span.nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-local { display: none; background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@keyframes pulsoLocal {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    50% { opacity: .72; box-shadow: 0 0 0 4px rgba(255,255,255,.22); }
}
.btn-local, .chip-local { animation: pulsoLocal 2.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .btn-local, .chip-local { animation: none; } }

/* Bola flutuante: Nova venda */
.fab { position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 66px; height: 66px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 30px; box-shadow: 0 6px 16px rgba(0,0,0,.3); cursor: pointer; z-index: 20; display: none; align-items: center; justify-content: center; }
.fab.show { display: flex; }
.fab:active { transform: scale(.94); background: var(--primary-dark); }



/* Data compacta e desconto por item */
.in-data { width: auto; max-width: 170px; padding: 8px 10px; font-size: 14px; border-radius: 10px; }
.line .sub { text-align: right; font-weight: 800; font-size: 15px; margin-left: auto; line-height: 1.15; }
.line .sub small { display: inline; margin-right: 6px; font-weight: 600; font-size: 12px; color: #888; text-decoration: line-through; }
.line .desc { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.line .desc label { font-size: 12px; font-weight: 700; color: #555; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { border: none; background: #f6f6f6; padding: 9px 13px; font-size: 14px; font-weight: 700; color: #555; cursor: pointer; }
.seg button.on { background: var(--primary); color: #fff; }
.line .desc input { flex: 1; min-width: 0; padding: 9px 10px; font-size: 15px; }
.line .desc .eq { font-size: 12px; color: var(--muted); white-space: nowrap; }


/* Item da venda (layout: nome / Qtd + Desconto / subtotal + remover) */
.line { background: #f8f9fb; padding: 14px; }
.line .pname { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
.line .cols { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; }
.line .col label { display: block; font-size: 12px; font-weight: 700; color: #555; margin-bottom: 5px; }
.line .stepper { justify-content: space-between; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 4px; gap: 4px; }
.line .stepper button { width: 48px; height: 44px; border: none; border-radius: 9px; background: #f1f1f4; }
.line .stepper span { min-width: 34px; font-size: 18px; }
.line .dsc { display: flex; gap: 8px; }
.line .dsc input { width: 64px; flex: none; min-width: 0; text-align: center; padding: 12px 8px; font-size: 16px; border-radius: 12px; }
.line .dsc select { width: 62px; flex: none; padding: 12px 4px; font-size: 15px; font-weight: 700; border-radius: 12px; }
.line .foot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 12px; }
.line .foot .sub { margin-left: 0; font-size: 17px; }
.line .foot .eq { font-size: 12px; color: var(--muted); margin-right: auto; }
.line .rm { width: 42px; height: 42px; border-radius: 50%; border: none; background: #fde2e4; color: var(--danger); font-size: 22px; cursor: pointer; line-height: 1; flex: none; }
.line .rm:active { background: #f9c6ca; }


.btn-add { display: block; width: 100%; margin-top: 12px; padding: 14px; border: 1px solid #b98fb0; border-radius: 12px; background: #f1e6ef; color: var(--primary); font-size: 16px; font-weight: 700; cursor: pointer; }
.btn-add:active { background: #e6d3e2; }
.btn-add[disabled] { opacity: .6; }


/* Tabela de estoque */
.tabela { background: #fff; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.tab-head, .tab-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 0 18px; }
.tab-head { background: #f7f7fa; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 700; color: #6b6b78; min-height: 50px; }
.tab-head button { background: none; border: none; font: inherit; color: inherit; cursor: pointer; padding: 14px 0 14px 12px; }
.tab-head button i { font-style: normal; font-size: 12px; opacity: .8; }
.tab-row { min-height: 64px; border-bottom: 1px solid #eee; }
.tab-row:last-child { border-bottom: none; }
.tab-row .d { font-weight: 700; font-size: 15px; text-transform: uppercase; }
.tab-row .q { text-align: right; white-space: nowrap; color: #666; font-size: 13px; font-weight: 600; }
.tab-row .q b { font-size: 24px; font-weight: 800; color: var(--primary); margin-right: 3px; }
.tab-row .q.zero b { color: var(--danger); }


.tab-row.click { cursor: pointer; }
.tab-row.click:active { background: #f4eef2; }

.btn-add.btn-sm { display: inline-block; width: auto; margin: 0 0 8px; padding: 8px 16px; font-size: 14px; border-radius: 10px; }

/* Pop-up de pagamento */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 45; align-items: center; justify-content: center; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; padding: 22px 20px; }
.modal h2 { font-size: 22px; color: var(--primary); margin-bottom: 4px; }
.modal .acoes { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.modal .acoes .btn { width: auto; margin-top: 0; padding: 12px 18px; font-size: 15px; }

/* Seletor de local */
.sheet-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; align-items: flex-end; justify-content: center; }
.sheet-bg.show { display: flex; }
.sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 80vh; overflow-y: auto; }
.sheet h2 { font-size: 18px; color: var(--primary); margin-bottom: 4px; }
.sheet p { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.sheet .opt { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 16px 14px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 12px; background: #fff; font-size: 16px; font-weight: 600; cursor: pointer; text-align: left; }
.sheet .opt.on { border-color: var(--primary); background: #f4eef2; color: var(--primary); }

/* Toast */
#toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(30px); background: #333; color: #fff; padding: 13px 18px; border-radius: 12px; font-size: 15px; max-width: 90%; text-align: center; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: var(--danger); }
#toast.ok { background: var(--ok); }
</style>
</head>
<body>

<header class="bar">
    <button class="btn-back" id="btnBack" onclick="voltar()" aria-label="Voltar">←</button>
    <button class="btn-local" id="btnLocal" onclick="abrirSeletorLocal()"><span>📍</span><span class="nm" id="btnLocalNome">Escolher local</span><span>▾</span></button>
    <h1 id="titulo" style="display:none">Estoque</h1>
    <button class="chip-local" id="chipLocal" onclick="abrirSeletorLocal()">📍 Local</button>
</header>

<main>

<!-- HOME -->
<section class="screen active" id="home">
    <div class="grid">
        <div class="tile" onclick="abrirEstoque()"><span class="ico">📦</span>Estoque</div>
        <div class="tile" onclick="abrirVendas()"><span class="ico">🧾</span>Vendas</div>
    </div>
</section>

<!-- ESTOQUE -->
<section class="screen" id="estoque">
    <input type="text" id="estBusca" placeholder="Nome do produto..." oninput="debounce('est', buscarEstoque)">
    <button type="button" class="btn-add btn-sm" onclick="abrirAdicionarEstoque()">Itens zerados</button>
    <div id="estStatus" class="status"></div>
    <div class="tabela" id="estTabela" style="display:none">
        <div class="tab-head"><span>Descrição</span><button type="button" id="estOrdem" onclick="alternarOrdemEstoque()">Quantidade <i>⇅</i></button></div>
        <div id="estLista"></div>
    </div>
</section>

<!-- VENDAS -->
<section class="screen" id="vendas">
 <input type="text" id="venBusca" placeholder="Número do pedido ou cliente..." oninput="debounce('ven', () => carregarVendas(true))">
    <div class="chips">
        <button class="chip" data-st="all" onclick="escolherStatus('all')">Últimas</button>
        <button class="chip" data-st="draft" onclick="escolherStatus('draft')">Orçamentos</button>
        <button class="chip" data-st="sale" onclick="escolherStatus('sale')">Confirmadas</button>
        <button class="chip" data-st="cancel" onclick="escolherStatus('cancel')">Canceladas</button>
    </div>
    <div id="venStatus" class="status"></div>
    <div id="venLista"></div>
</section>

<!-- NOVA VENDA -->
<section class="screen" id="novaVenda">
    <label class="f" style="margin-top:0">Cliente *</label>
    <div id="nvClienteBox"></div>

    <label class="f" for="nvData">Data da venda</label>
    <input type="date" id="nvData" class="in-data" onchange="venda.data = this.value">

    <div id="nvLinhas"></div>

    <button type="button" class="btn-add" id="nvProdBtn" onclick="abrirListaProdutos()" disabled>Carregando produtos...</button>
    <div class="prod-list" id="nvProdList">
        <input type="text" id="nvProdBusca" placeholder="Filtrar produto..." oninput="renderListaProdutos()" autocomplete="off">
        <div class="prod-head"><span>Produto</span><span>Estoque</span></div>
        <div class="prod-body" id="nvProdBody"></div>
    </div>

    <div class="sum"><span>Total</span><span id="nvTotal">R$ 0,00</span></div>

    <button class="btn" id="btnConfirmarVenda" onclick="salvarVenda(true)">Salvar</button>
    <button class="btn sec" id="btnOrcamento" onclick="salvarVenda(false)">Salvar Rascunho</button>
</section>

</main>

<button class="fab" id="fab" onclick="abrirNovaVenda()" aria-label="Nova venda">🛒</button>

<!-- Seletor de local -->
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this) fecharSeletorLocal()">
    <div class="sheet">
        <h2>Escolha o seu local</h2>
        <p>Será a origem das suas transferências e o local de saída das vendas.</p>
        <div id="sheetLista"></div>
        <button class="btn grey" id="sheetCancelar" onclick="fecharSeletorLocal()">Fechar</button>
    </div>
</div>

<!-- Pagar fatura -->
<div class="modal-bg" id="payBg">
    <div class="modal">
        <h2>Pagar Fatura</h2>
        <label class="f">Conta</label>
        <select id="payConta"></select>
        <label class="f">Valor</label>
        <input type="text" id="payValor" inputmode="decimal" autocomplete="off">
        <label class="f">Data de Pagamento</label>
        <input type="date" id="payData">
        <div class="acoes">
            <button class="btn grey" id="payDescartar" onclick="descartarPagamento()">Descartar</button>
            <button class="btn" id="payCriar" onclick="criarPagamento()">Criar pagamento</button>
        </div>
    </div>
</div>

<!-- Ajuste de estoque -->
<div class="modal-bg" id="ajBg">
    <div class="modal">
        <h2>Ajustar estoque</h2>
        <div id="ajNome" style="font-weight:700;margin:6px 0 2px"></div>
        <div id="ajAtual" style="font-size:13px;color:var(--muted)"></div>
        <label class="f">Nova quantidade</label>
        <input type="text" id="ajQtd" inputmode="decimal" autocomplete="off" onkeydown="if(event.key==='Enter')salvarAjuste()">
        <div class="acoes">
            <button class="btn grey" id="ajCancelar" onclick="fecharAjuste()">Descartar</button>
            <button class="btn" id="ajSalvar" onclick="salvarAjuste()">Salvar</button>
        </div>
    </div>
</div>

<!-- Adicionar item ao estoque -->
<div class="modal-bg" id="addBg">
    <div class="modal" style="padding:18px 0 0">
        <h2 style="padding:0 20px">Itens zerados</h2>
        <div style="padding:8px 16px 10px"><input type="text" id="addBusca" placeholder="Nome do produto..." oninput="debounce('add', buscarAdicionaveis)" autocomplete="off"></div>
        <div id="addStatus" class="status" style="padding:0 16px 6px"></div>
        <div class="prod-body" id="addLista" style="max-height:50vh"></div>
        <div class="acoes" style="margin:0;padding:12px 16px;border-top:1px solid var(--border)">
            <button class="btn grey" onclick="fecharAdicionar()">Fechar</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
/* ============ Utilidades ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => 'R$ ' + (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function dataHora(v) {
    if (!v) return '-';
    const d = new Date(String(v).replace(' ', 'T') + 'Z');
    return isNaN(d) ? '-' : d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

let toastTimer;
function toast(msg, tipo) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'show ' + (tipo || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, tipo === 'err' ? 5000 : 3000);
}

async function api(action, dados = {}) {
    try {
        const r = await fetch('/api/odoo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, ...dados })
        });
        const j = await r.json().catch(() => ({ error: 'A API não respondeu corretamente (erro ' + r.status + '). Confira se o arquivo está em api/odoo.js no GitHub.' }));
        if (!r.ok && !j.error) j.error = 'Erro ' + r.status;
        return j;
    } catch (e) {
        return { error: 'Sem conexão com o servidor.' };
    }
}

const timers = {};
function debounce(k, fn, ms = 450) { clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); }

/* ============ Meu local (origem das vendas e transferências) ============ */
let meuLocal = null;           // { wh: {id, name}, loc: {id, name} | null }
let armazensCache = null;
let aoEscolherLocal = null;

try { meuLocal = JSON.parse(localStorage.getItem('deuris_meu_local') || 'null'); } catch (e) { meuLocal = null; }

function atualizarRotuloLocal() {
    const nome = meuLocal ? meuLocal.wh.name : 'Escolher local';
    $('btnLocalNome').textContent = nome;
    $('chipLocal').textContent = '📍 ' + (meuLocal ? meuLocal.wh.name : 'Escolher');
}

function exigirLocal(cb) {
    if (meuLocal) return cb();
    abrirSeletorLocal(true, cb);
}

async function abrirSeletorLocal(obrigatorio, cb) {
    aoEscolherLocal = cb || null;
    $('sheetCancelar').style.display = obrigatorio ? 'none' : 'block';
    $('sheetBg').dataset.obrigatorio = obrigatorio ? '1' : '';
    $('sheetBg').classList.add('show');
    $('sheetLista').innerHTML = '<div class="status">Carregando...</div>';

    if (!armazensCache) {
        const d = await api('get_warehouses');
        if (!d.result) {
            $('sheetLista').innerHTML = '<div class="status">' + esc(d.error || 'Não foi possível carregar os locais.') + '</div>';
            return;
        }
        armazensCache = d.result;
    }
    $('sheetLista').innerHTML = armazensCache.map(w => `
        <button class="opt ${meuLocal && meuLocal.wh.id === w.id ? 'on' : ''}" onclick="escolherLocal(${w.id})">
            <span>${esc(w.name)}</span><span>${meuLocal && meuLocal.wh.id === w.id ? '✓' : ''}</span>
        </button>`).join('');
}

function fecharSeletorLocal() {
    if ($('sheetBg').dataset.obrigatorio) return;   // na primeira vez é preciso escolher
    $('sheetBg').classList.remove('show');
    aoEscolherLocal = null;
}

function escolherLocal(id) {
    const w = (armazensCache || []).find(x => x.id === id);
    if (!w) return;
    meuLocal = {
        wh: { id: w.id, name: w.name },
        loc: Array.isArray(w.lot_stock_id) ? { id: w.lot_stock_id[0], name: w.lot_stock_id[1] } : null
    };
    try { localStorage.setItem('deuris_meu_local', JSON.stringify(meuLocal)); } catch (e) {}
    atualizarRotuloLocal();
    $('sheetBg').dataset.obrigatorio = '';
    $('sheetBg').classList.remove('show');
    toast('Seu local: ' + w.name, 'ok');

    const cb = aoEscolherLocal; aoEscolherLocal = null;
    if (cb) cb();
    else {
        const tela = pilha[pilha.length - 1];
        if (tela === 'novaVenda' && venda) carregarProdutosDoLocal();       // trocou o local no meio da venda
        else if (tela === 'estoque') buscarEstoque();
        else if (tela === 'vendas' && (venStatus || $('venBusca').value.trim())) carregarVendas();
    }
}

/* ============ Navegação ============ */
const TITULOS = { home: '', estoque: 'Estoque', vendas: 'Vendas', novaVenda: 'Nova venda' };
let pilha = ['home'];

function ir(tela) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(tela).classList.add('active');
    const home = tela === 'home';
    $('titulo').textContent = TITULOS[tela];
    $('titulo').style.display = 'block';
    $('btnLocal').style.display = 'none';
    $('chipLocal').style.display = 'inline-block';
    $('btnBack').classList.toggle('show', !home);
    $('fab').classList.toggle('show', ['home', 'vendas'].includes(tela));
    window.scrollTo(0, 0);
}
function abrir(tela) { pilha.push(tela); ir(tela); }
function voltar() {
    if (pilha.length > 1) pilha.pop();
    ir(pilha[pilha.length - 1]);
}

/* ============ Estoque (sempre do local que o usuário escolheu) ============ */
let estReq = 0;

// Garante que temos o local de estoque (ex.: SHOP DO PÉ/Estoque) do local escolhido
async function garantirLocalDeEstoque() {
    if (!meuLocal || meuLocal.loc) return !!meuLocal;
    if (!armazensCache) {
        const d = await api('get_warehouses');
        if (d.result) armazensCache = d.result;
    }
    const w = (armazensCache || []).find(x => x.id === meuLocal.wh.id);
    if (w && Array.isArray(w.lot_stock_id)) {
        meuLocal.loc = { id: w.lot_stock_id[0], name: w.lot_stock_id[1] };
        try { localStorage.setItem('deuris_meu_local', JSON.stringify(meuLocal)); } catch (e) {}
    }
    return !!meuLocal.loc;
}

function abrirEstoque() {
    exigirLocal(async () => {
        $('estBusca').value = '';
        $('estLista').innerHTML = ''; $('estTabela').style.display = 'none';
        $('estStatus').textContent = 'Carregando estoque...';
        if (pilha[pilha.length - 1] !== 'estoque') abrir('estoque');
        buscarEstoque();
    });
}

async function buscarEstoque() {
    if (!meuLocal) return;
    const query = $('estBusca').value.trim();
    const req = ++estReq;
    $('estStatus').textContent = 'Pesquisando...';

    if (!(await garantirLocalDeEstoque())) {
        if (req === estReq) $('estStatus').textContent = 'Não foi possível identificar o estoque do seu local. Atualize o arquivo api/odoo.js.';
        return;
    }
    const d = await api('get_stock', { query, location_id: meuLocal.loc.id });
    if (req !== estReq) return;
    if (!d.result) { $('estStatus').textContent = d.error || 'Erro ao carregar estoque.'; return; }
    if (d.result.length === 0) { estDados = []; $('estTabela').style.display = 'none'; $('estStatus').textContent = 'Nenhum item em estoque encontrado.'; return; }
    $('estStatus').textContent = d.result.length + ' item(ns) encontrado(s)';
    const porProduto = {};
    d.result.forEach(i => {
        if (!Array.isArray(i.product_id)) return;
        const pid = i.product_id[0];
        if (!porProduto[pid]) porProduto[pid] = { id: pid, nome: i.product_id[1], qtd: 0 };
        porProduto[pid].qtd += Number(i.quantity) || 0;
    });
    estDados = Object.values(porProduto);
    renderEstoque();
}

let estDados = [], estOrdem = null;   // estOrdem: null (nome), 'desc' ou 'asc' pela quantidade

function alternarOrdemEstoque() {
    estOrdem = estOrdem === 'desc' ? 'asc' : 'desc';
    renderEstoque();
}

function renderEstoque() {
    const itens = estDados.slice();
    if (estOrdem) itens.sort((a, b) => estOrdem === 'desc' ? b.qtd - a.qtd : a.qtd - b.qtd);
    else itens.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    $('estOrdem').querySelector('i').textContent = estOrdem === 'desc' ? '↓' : estOrdem === 'asc' ? '↑' : '⇅';
    $('estTabela').style.display = '';
    $('estLista').innerHTML = itens.map(i => `
        <div class="tab-row click" onclick="abrirAjuste(${i.id})">
            <div class="d">${esc(i.nome)}</div>
            <div class="q${i.qtd <= 0 ? ' zero' : ''}"><b>${i.qtd}</b>un.</div>
        </div>`).join('');
}


/* ============ Ajuste de estoque ============ */
let ajProduto = null;
const fmtQtd = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 3 });

function abrirAjuste(id, nome, atual) {
    const item = estDados.find(x => x.id === id);
    ajProduto = { id, nome: item ? item.nome : nome, atual: item ? item.qtd : (atual || 0) };
    $('ajNome').textContent = ajProduto.nome;
    $('ajAtual').textContent = 'Quantidade atual: ' + fmtQtd(ajProduto.atual) + ' un.';
    $('ajQtd').value = String(ajProduto.atual).replace('.', ',');
    $('ajBg').classList.add('show');
    setTimeout(() => { $('ajQtd').focus(); $('ajQtd').select(); }, 50);
}
function fecharAjuste() { $('ajBg').classList.remove('show'); ajProduto = null; }

async function salvarAjuste() {
    if (!ajProduto) return;
    const qtd = parseFloat(String($('ajQtd').value).replace(',', '.'));
    if (isNaN(qtd) || qtd < 0) return toast('Informe uma quantidade válida (0 ou mais).', 'err');
    if (qtd === ajProduto.atual) return fecharAjuste();
    if (!(await garantirLocalDeEstoque())) return toast('Não foi possível identificar o local de estoque.', 'err');
    const btn = $('ajSalvar'), btnC = $('ajCancelar');
    btn.disabled = btnC.disabled = true;
    btn.textContent = 'Salvando...';
    const d = await api('adjust_stock', { product_id: ajProduto.id, location_id: meuLocal.loc.id, quantity: qtd });
    btn.disabled = btnC.disabled = false;
    btn.textContent = 'Salvar';
    if (d.success) {
        fecharAjuste();
        toast('Estoque ajustado!', 'ok');
        buscarEstoque();
    } else {
        toast(d.error || 'Erro ao ajustar o estoque.', 'err');
    }
}

/* ---- adicionar item que ainda não está no estoque ---- */
let addReq = 0;
async function abrirAdicionarEstoque() {
    $('addBusca').value = '';
    $('addLista').innerHTML = '';
    $('addBg').classList.add('show');
    buscarAdicionaveis();
}
function fecharAdicionar() { $('addBg').classList.remove('show'); }

let addDados = [];
async function buscarAdicionaveis() {
    const req = ++addReq;
    $('addStatus').textContent = 'Carregando...';
    if (!(await garantirLocalDeEstoque())) { $('addStatus').textContent = 'Não foi possível identificar o local de estoque.'; return; }
    const d = await api('get_addable_products', { location_id: meuLocal.loc.id, query: $('addBusca').value.trim() });
    if (req !== addReq) return;
    if (!d.products) { $('addStatus').textContent = d.error || 'Erro ao carregar produtos.'; return; }
    addDados = d.products;
    $('addStatus').textContent = d.products.length ? d.products.length + ' item(ns) zerado(s)' : 'Nenhum item encontrado.';
    $('addLista').innerHTML = d.products.map(p => `<button type="button" class="prod-item" style="grid-template-columns:1fr" onclick="escolherAdicionar(${p.id})"><span>${esc(p.display_name)}</span></button>`).join('');
}
function escolherAdicionar(id) {
    const p = addDados.find(x => x.id === id);
    if (!p) return;
    fecharAdicionar();
    abrirAjuste(id, p.display_name, 0);
}

/* ============ Vendas (só carrega depois de escolher um filtro) ============ */
let venStatus = null, venReq = 0;

function abrirVendas() {
    venStatus = null;
    $('venBusca').value = '';
    document.querySelectorAll('#vendas .chip').forEach(c => c.classList.remove('on'));
    $('venLista').innerHTML = '';
    $('venStatus').textContent = 'Escolha "Últimas", um status ou digite para pesquisar.';
    abrir('vendas');
}

function escolherStatus(st) {
    venStatus = st;
    document.querySelectorAll('#vendas .chip').forEach(c => c.classList.toggle('on', c.dataset.st === st));
    carregarVendas();
}

async function carregarVendas() {
    const query = $('venBusca').value.trim();
    const req = ++venReq;
    if (!query && !venStatus) {
        $('venLista').innerHTML = '';
        $('venStatus').textContent = 'Escolha "Últimas", um status ou digite para pesquisar.';
        return;
    }
    $('venStatus').textContent = 'Carregando...';
    const d = await api('get_sales', { query, warehouse_id: meuLocal ? meuLocal.wh.id : '', order_status: (venStatus && venStatus !== 'all') ? venStatus : '' });
    if (req !== venReq) return;
    if (!d.result) { $('venStatus').textContent = d.error || 'Erro ao carregar vendas.'; return; }
    if (d.result.length === 0) { $('venLista').innerHTML = ''; $('venStatus').textContent = 'Nenhuma venda encontrada.'; return; }
    $('venStatus').textContent = d.result.length + ' venda(s)';

    const stBadge = s => s === 'cancel' ? '<span class="badge b-bad">Cancelada</span>'
        : (s === 'sale' || s === 'done') ? '<span class="badge b-ok">Confirmada</span>'
        : '<span class="badge b-warn">Orçamento</span>';
    const pgBadge = p => p === 'pago' ? '<span class="badge b-ok">Pago</span>'
        : p === 'nao_pago' ? '<span class="badge b-warn">Não pago</span>'
        : '<span class="badge b-info">Sem fatura</span>';

    $('venLista').innerHTML = d.result.map(o => `
        <div class="card">
            <div class="row"><div class="t">${esc(o.name)}</div><div class="money">${brl(o.amount_total)}</div></div>
            <div class="s">${esc(Array.isArray(o.partner_id) ? o.partner_id[1] : '-')}</div>
            <div class="s">${dataHora(o.date_order)}</div>
            <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap">${stBadge(o.state)} ${o.state !== 'cancel' ? pgBadge(o.payment_summary) : ''}</div>
        </div>`).join('');
}

/* ============ Nova venda ============ */
let venda = null;      // { partner, warehouse, produtos[], linhas[] }
let nvBuscaReq = 0;

function dataLocalAgora() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// Data escolhida (só o dia) + hora atual, para o Odoo guardar a data/hora do pedido
function dataVendaISO() {
    if (!venda.data) return null;
    const [y, m, d] = venda.data.split('-').map(Number);
    const n = new Date();
    return new Date(y, m - 1, d, n.getHours(), n.getMinutes()).toISOString();
}

function abrirNovaVenda() {
    exigirLocal(iniciarNovaVenda);
}

async function iniciarNovaVenda() {
    venda = { partner: null, warehouse: String(meuLocal.wh.id), produtos: [], linhas: [], data: dataLocalAgora().slice(0, 10) };
    $('nvData').value = venda.data;
    fecharListaProdutos();
    renderCliente();
    renderLinhas();
    // evita empilhar a tela duas vezes se já estiver nela
    if (pilha[pilha.length - 1] !== 'novaVenda') abrir('novaVenda');
    carregarProdutosDoLocal();
}

function renderCliente() {
    const box = $('nvClienteBox');
    if (venda.partner) {
        box.innerHTML = `<div class="picked"><span>${esc(venda.partner.name)}</span><button onclick="trocarCliente()">trocar</button></div>`;
    } else {
        box.innerHTML = `<input type="text" id="nvCliBusca" placeholder="Buscar ou criar cliente..." oninput="debounce('cli', buscarCliente, 350)" autocomplete="off">
                         <div id="nvCliRes"></div>`;
    }
}
function trocarCliente() { venda.partner = null; renderCliente(); }

async function buscarCliente() {
    const q = ($('nvCliBusca').value || '').trim();
    const box = $('nvCliRes');
    const req = ++nvBuscaReq;
    if (!q) { box.innerHTML = ''; return; }
    const d = await api('search_partners', { query: q });
    if (req !== nvBuscaReq || !$('nvCliRes')) return;
    const itens = (d.partners || []).map(p => `<button onclick="escolherCliente(${p.id}, decodeURIComponent('${encodeURIComponent(p.name)}'))">${esc(p.name)}</button>`).join('');
    box.innerHTML = `<div class="results">${itens}<button class="new" onclick="criarCliente()">+ Criar cliente "${esc(q)}"</button></div>`;
}
function escolherCliente(id, name) { venda.partner = { id, name }; renderCliente(); }

async function criarCliente() {
    const nome = ($('nvCliBusca').value || '').trim();
    if (!nome) return;
    const d = await api('create_partner', { name: nome });
    if (d.success) { escolherCliente(d.id, d.name); toast('Cliente criado.', 'ok'); }
    else toast(d.error || 'Não foi possível criar o cliente.', 'err');
}

async function carregarProdutosDoLocal() {
    venda.warehouse = String(meuLocal.wh.id);
    const btn = $('nvProdBtn');
    btn.disabled = true;
    btn.textContent = 'Carregando produtos...';
    const d = await api('get_warehouse_products', { warehouse_id: meuLocal.wh.id });
    if (!d.products) { btn.textContent = 'Erro ao carregar'; toast(d.error || 'Erro ao carregar produtos.', 'err'); return; }
    venda.produtos = d.products;
    btn.textContent = d.products.length ? '＋ Adicionar produto' : 'Sem estoque neste local';
    btn.disabled = d.products.length === 0;
    renderListaProdutos();

    // remove das linhas os produtos que não existem neste local
    const antes = venda.linhas.length;
    venda.linhas = venda.linhas.filter(l => d.products.some(p => p.id === l.id));
    if (venda.linhas.length < antes) toast('Itens sem estoque neste local foram removidos.', 'err');
    renderLinhas();
}

function abrirListaProdutos() {
    const l = $('nvProdList');
    if (l.classList.contains('show')) return fecharListaProdutos();
    $('nvProdBusca').value = '';
    renderListaProdutos();
    l.classList.add('show');
}
function fecharListaProdutos() { $('nvProdList').classList.remove('show'); }

function renderListaProdutos() {
    const q = ($('nvProdBusca').value || '').trim().toLowerCase();
    const itens = (venda.produtos || []).filter(p => p.display_name.toLowerCase().includes(q));
    $('nvProdBody').innerHTML = itens.length
        ? itens.map(p => `<button type="button" class="prod-item" onclick="escolherProduto(${p.id})"><span>${esc(p.display_name)}</span><span class="q${p.stock_qty <= 0 ? ' zero' : ''}">${p.stock_qty}</span></button>`).join('')
        : '<div class="prod-vazio">Nenhum produto encontrado</div>';
}
function escolherProduto(id) { fecharListaProdutos(); adicionarProduto(id); }

function adicionarProduto(id) {
    if (!id) return;
    id = Number(id);
    const ja = venda.linhas.find(l => l.id === id);
    if (ja) { ja.qty += 1; renderLinhas(); return; }
    const p = venda.produtos.find(x => x.id === id);
    if (!p) return;
    venda.linhas.push({ id: p.id, nome: p.display_name, qty: 1, price: p.list_price || 0, estoque: p.stock_qty, discTipo: 'R$', discVal: 0 });
    renderLinhas();
}

function mudarQtd(id, delta) {
    const l = venda.linhas.find(x => x.id === id);
    if (!l) return;
    l.qty += delta;
    if (l.qty < 1) venda.linhas = venda.linhas.filter(x => x.id !== id);
    renderLinhas();
}
/* Desconto: o Odoo só aceita % por linha; se o usuário digitar em R$, converte para % */
const bruto = l => l.qty * l.price;
function pctDesc(l) {
    const v = Number(l.discVal) || 0;
    if (l.discTipo === 'R$') return bruto(l) > 0 ? Math.min(100, Math.max(0, v / bruto(l) * 100)) : 0;
    return Math.min(100, Math.max(0, v));
}
const totalLinha = l => bruto(l) * (1 - pctDesc(l) / 100);
const fmtPct = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '%';

function atualizarLinha(l) {
    const sub = document.getElementById('sub' + l.id);
    if (sub) sub.innerHTML = (pctDesc(l) > 0 ? `<small>${brl(bruto(l))}</small>` : '') + brl(totalLinha(l));
    const eq = document.getElementById('eq' + l.id);
    if (eq) eq.textContent = l.discTipo === 'R$' && pctDesc(l) > 0 ? '= ' + fmtPct(pctDesc(l)) : '';
    atualizarTotal();
}
function mudarDesc(id, v) {
    const l = venda.linhas.find(x => x.id === id);
    if (!l) return;
    l.discVal = parseFloat(String(v).replace(',', '.')) || 0;
    atualizarLinha(l);
}
function mudarTipoDesc(id, tipo) {
    const l = venda.linhas.find(x => x.id === id);
    if (!l || l.discTipo === tipo) return;
    // mantém o mesmo desconto ao alternar entre % e R$
    const p = pctDesc(l);
    l.discTipo = tipo;
    l.discVal = tipo === 'R$' ? Math.round(bruto(l) * p) / 100 : Math.round(p * 100) / 100;
    renderLinhas();
}
function removerLinha(id) { venda.linhas = venda.linhas.filter(x => x.id !== id); renderLinhas(); }

function atualizarTotal() {
    $('nvTotal').textContent = brl(venda.linhas.reduce((s, l) => s + totalLinha(l), 0));
}

function renderLinhas() {
    $('nvLinhas').innerHTML = venda.linhas.map(l => `
        <div class="line">
            <div class="pname">${esc(l.nome)}</div>
            <div class="cols">
                <div class="col">
                    <label>Qtd.</label>
                    <div class="stepper">
                        <button onclick="mudarQtd(${l.id}, -1)">−</button><span>${l.qty}</span><button onclick="mudarQtd(${l.id}, 1)">+</button>
                    </div>
                </div>
                <div class="col">
                    <label>Desconto</label>
                    <div class="dsc">
                        <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="0" value="${l.discVal || ''}" oninput="mudarDesc(${l.id}, this.value)">
                        <select onchange="mudarTipoDesc(${l.id}, this.value)">
                            <option value="R$"${l.discTipo === 'R$' ? ' selected' : ''}>R$</option>
                            <option value="%"${l.discTipo === '%' ? ' selected' : ''}>%</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="foot">
                <span class="eq" id="eq${l.id}"></span>
                <div class="sub" id="sub${l.id}"></div>
                <button class="rm" onclick="removerLinha(${l.id})" aria-label="Remover">×</button>
            </div>
            ${l.qty > l.estoque ? `<div class="warn-txt">Atenção: só há ${l.estoque} un em estoque.</div>` : ''}
        </div>`).join('');
    venda.linhas.forEach(atualizarLinha);
    atualizarTotal();
}

function voltarParaVendas() {
    pilha = ['home', 'vendas'];
    ir('vendas');
    $('venBusca').value = '';
    escolherStatus('all');
}

/* ============ Pagamento da fatura ============ */
let pagFatura = null;
let diariosCache = null;

async function abrirPagamento(invoiceId, total) {
    pagFatura = invoiceId;
    if (!diariosCache) {
        const d = await api('get_payment_journals');
        diariosCache = d.result || [];
    }
    if (diariosCache.length === 0) { toast('Nenhuma conta de pagamento encontrada.', 'err'); return voltarParaVendas(); }
    const ultima = localStorage.getItem('ultimaContaPgto');
    $('payConta').innerHTML = diariosCache.map(c => `<option value="${c.id}"${String(c.id) === ultima ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
    $('payValor').value = String(Math.round(total * 100) / 100).replace('.', ',');
    $('payData').value = dataLocalAgora().slice(0, 10);
    $('payBg').classList.add('show');
}

function descartarPagamento() {
    $('payBg').classList.remove('show');
    pagFatura = null;
    voltarParaVendas();
}

async function criarPagamento() {
    const valor = parseFloat(String($('payValor').value).replace(',', '.'));
    if (!valor || valor <= 0) return toast('Informe o valor do pagamento.', 'err');
    if (!$('payData').value) return toast('Informe a data do pagamento.', 'err');
    const btn = $('payCriar'), btnD = $('payDescartar');
    btn.disabled = btnD.disabled = true;
    btn.textContent = 'Processando...';
    const d = await api('register_payment', {
        order_id: pagFatura,
        journal_id: $('payConta').value,
        amount: valor,
        payment_date: $('payData').value
    });
    btn.disabled = btnD.disabled = false;
    btn.textContent = 'Criar pagamento';
    if (d.success) {
        try { localStorage.setItem('ultimaContaPgto', $('payConta').value); } catch (e) {}
        $('payBg').classList.remove('show');
        pagFatura = null;
        toast('Pagamento registrado!', 'ok');
        voltarParaVendas();
    } else {
        toast(d.error || 'Erro ao registrar o pagamento.', 'err');
    }
}

async function salvarVenda(confirmar) {
    if (!venda.partner) return toast('Selecione um cliente.', 'err');
    if (!meuLocal) return toast('Escolha o seu local.', 'err');
    if (venda.linhas.length === 0) return toast('Adicione ao menos um produto.', 'err');
    if (!venda.data) return toast('Informe a data da venda.', 'err');

    const btnA = $('btnConfirmarVenda'), btnB = $('btnOrcamento');
    const txtA = btnA.textContent, txtB = btnB.textContent;
    btnA.disabled = btnB.disabled = true;
    (confirmar ? btnA : btnB).textContent = 'Processando...';

    const d = await api('save_sale_order', {
        partner_id: venda.partner.id,
        warehouse_id: meuLocal.wh.id,
        lines: venda.linhas.map(l => ({ product_id: l.id, qty: l.qty, price: l.price, discount: Number(pctDesc(l).toFixed(4)) })),
        date_order: dataVendaISO(),
        invoice_date: dataLocalAgora().slice(0, 10),
        confirm: confirmar
    });

    btnA.disabled = btnB.disabled = false;
    btnA.textContent = txtA; btnB.textContent = txtB;

    if (d.success) {
        const avisos = (d.warnings || []).join(' ');
        toast(confirmar ? ('Venda lançada!' + (avisos ? ' ' + avisos : '')) : 'Rascunho salvo!', avisos ? 'err' : 'ok');
        const total = venda.linhas.reduce((s, l) => s + totalLinha(l), 0);
        if (confirmar && d.invoice_id && d.invoice_posted) {
            // fatura já criada e lançada: abre direto o pagamento
            await abrirPagamento(d.invoice_id, total);
        } else {
            voltarParaVendas();
        }
    } else {
        toast(d.error || 'Erro ao salvar a venda.', 'err');
    }
}


atualizarRotuloLocal();
ir('home');
if (!meuLocal) abrirSeletorLocal(true, null);
</script>
